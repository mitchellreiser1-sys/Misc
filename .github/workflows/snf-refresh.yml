name: SNF Analytics refresh

# Checks CMS daily. Publishes only when CMS has released new files and every
# reconciliation gate passes. A failure leaves the published site untouched.
on:
  schedule:
    # Twice a day. GitHub can delay or occasionally skip a scheduled run, so a
    # second daily check keeps a missed one from costing a full day.
    - cron: "23 10 * * *"
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if CMS has not published new files
        type: boolean
        default: false
      send_email:
        description: Send the what-changed email for this run (use with force to test email setup)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["snf-analytics/**", ".github/workflows/snf-refresh.yml"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: snf-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    defaults:
      run:
        working-directory: snf-analytics
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m unittest discover -s tests
          node --test tests/rollup.test.js

      - name: Fetch the manifest of the currently published site
        run: |
          url=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url 2>/dev/null || true)
          if [ -n "$url" ]; then curl -fsSL "${url%/}/data/manifest.json" -o prev_manifest.json || rm -f prev_manifest.json; fi

      - name: Download, validate, and build
        id: build
        run: |
          force=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ]; then force="--force"; fi
          # Release history from the previous refresh; the seed in the repo is used if none exists yet
          mkdir -p state
          gh release download snf-state --pattern history.json.gz --dir state 2>/dev/null || echo "No saved history yet; starting from the seed."
          python -m pipeline.run --work work --out dist --previous prev_manifest.json \
            --state-in state/history.json.gz --state-out state_out/history.json.gz $force

      - name: Archive the raw CMS files for this release
        if: steps.build.outputs.changed == 'true'
        run: |
          tag="cms-${{ steps.build.outputs.release }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            (cd work && zip -q -r "../$tag.zip" raw meta.json)
            gh release create "$tag" "$tag.zip" --title "CMS raw files, processing date ${{ steps.build.outputs.release }}" \
              --notes "Unmodified CMS Provider Data Catalog files used to build the site, with download metadata and SHA-256 hashes in meta.json."
          fi

      - uses: actions/configure-pages@v5
        if: steps.build.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.changed == 'true'
        with:
          path: snf-analytics/dist
      # GitHub occasionally cannot find the just-uploaded site files for a few
      # seconds. One retry after a short wait covers that without failing the run.
      - uses: actions/deploy-pages@v4
        if: steps.build.outputs.changed == 'true'
        id: deploy
        continue-on-error: true
      - name: Wait before retrying the deployment
        if: steps.build.outputs.changed == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 45
      - uses: actions/deploy-pages@v4
        if: steps.build.outputs.changed == 'true' && steps.deploy.outcome == 'failure'
        id: deploy_retry

      - name: Save release history for the next refresh
        if: steps.build.outputs.changed == 'true'
        run: |
          gh release view snf-state >/dev/null 2>&1 || gh release create snf-state --latest=false --title "SNF Analytics state" \
            --notes "Working state for the pipeline: published ratings and flags from each CMS release. Rebuilt from CMS archives if lost."
          gh release upload snf-state state_out/history.json.gz --clobber

      - name: Email what changed
        if: steps.build.outputs.changed == 'true' && (steps.build.outputs.new_release == 'true' || inputs.send_email)
        env:
          ALERT_TO: ${{ secrets.ALERT_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          WATCHLIST_CCNS: ${{ secrets.WATCHLIST_CCNS }}
        run: python -m pipeline.notify --site dist --site-url "${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}"

      - name: Open an issue when the refresh fails
        if: failure()
        run: |
          title="SNF Analytics refresh failed"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --body "A refresh run failed. If it failed before the deploy step, nothing was published and the site is still showing the last release that passed every check. If it failed at the email step, the site was updated but the email was not sent. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
